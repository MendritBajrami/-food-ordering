[build]
builder = "NIXPACKS"
buildCommand = "npm install --prefix backend || npm install"

[deploy]
startCommand = "node src/index.js || node backend/src/index.js"
healthcheckPath = "/api/health"
healthcheckTimeout = 100
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

[variables]
NODE_ENV = "production"